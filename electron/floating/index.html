<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>بطاقة — MemoFlow</title>
    <link rel="stylesheet" href="/floating.css" />
    <script src="/floating.js" defer></script>
  </head>
  <body>
    <header class="titlebar" aria-label="اسحب البطاقة لتحريكها">
      <span class="brand">MemoFlow</span>
      <div class="controls">
        <button
          id="pin"
          aria-label="تثبيت فوق النوافذ"
          title="تثبيت فوق النوافذ"
          aria-pressed="true"
        >
          <svg viewBox="0 0 24 24">
            <path d="m16 3 5 5-4 1-3 5v4l-3-3-6 6m9-7-5-5H5l5-3 1-4Z" />
          </svg>
        </button>
        <button
          id="return"
          aria-label="إعادة البطاقة إلى التطبيق"
          title="إعادة البطاقة إلى التطبيق"
        >
          <svg viewBox="0 0 24 24"><path d="M14 4H4v16h16V10M10 14 21 3m-7 0h7v7" /></svg>
        </button>
        <button id="close" aria-label="إغلاق البطاقة" title="إغلاق البطاقة">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></svg>
        </button>
      </div>
    </header>
    <main>
      <h1 id="title"></h1>
      <p id="progress" hidden></p>
      <div id="content" role="document" aria-label="محتوى البطاقة"></div>
      <ul id="checklist" aria-label="بنود المهمة" hidden></ul>
    </main>
    <footer><span id="state">مثبتة فوق النوافذ</span><time id="updated"></time></footer>
    <p id="error" role="alert" hidden>تعذر عرض البطاقة. أغلقها وافتحها مجددًا.</p>
  </body>
</html>
