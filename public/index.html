<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f8fafc" />
    <title>MemoFlow</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 420px);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        color: #64748b;
        line-height: 1.8;
      }
      button {
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>تعذر الاتصال بـ MemoFlow</h1>
      <p>تحقق من اتصال الإنترنت ثم أعد المحاولة. بياناتك المشفّرة لم تتغير.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
