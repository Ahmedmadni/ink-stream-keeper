name: Verify MemoFlow

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Riyadh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser

  android-debug:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run android:sync
      - name: Run Android lint
        run: |
          set +e
          ./gradlew lintDebug --no-daemon
          status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ "$status" -ne 0 ] && [ -f "$report" ]; then
            cat "$report"
          fi
          exit "$status"
        working-directory: android
      - run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Build one-time unsigned release candidates
        run: ./gradlew assembleRelease bundleRelease -PmemoflowUnsignedCi=true --no-daemon
        working-directory: android
      - name: Collect APK signing tool
        run: |
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools_dir/apksigner"
          mkdir -p android-signing-tools/lib
          cp "$build_tools_dir/apksigner" android-signing-tools/apksigner
          cp "$build_tools_dir/lib/apksigner.jar" android-signing-tools/lib/apksigner.jar
      - name: Write APK checksum
        run: sha256sum app-debug.apk > app-debug.apk.sha256
        working-directory: android/app/build/outputs/apk/debug
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Android-Debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Unsigned-Release-Candidate
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android-signing-tools/
          if-no-files-found: error
