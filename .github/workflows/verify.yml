name: Verify MemoFlow

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Riyadh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build:web-release
      - run: node scripts/verify-web-server.mjs
      - name: Package runnable web release
        run: |
          cp docs/WEB_RELEASE.txt .output/README.txt
          cd .output
          zip -qr ../MemoFlow-Web-1.2.11.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Web-Release
          path: MemoFlow-Web-1.2.11.zip
          if-no-files-found: error
      - name: Save UI review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-UI-Checks
          path: .qa-results/*.png
          include-hidden-files: true
          if-no-files-found: ignore

  android-debug:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run android:sync
      - name: Run Android lint
        run: |
          set +e
          ./gradlew lintDebug --no-daemon
          status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ "$status" -ne 0 ] && [ -f "$report" ]; then
            cat "$report"
          fi
          exit "$status"
        working-directory: android
      - run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Write APK checksum
        run: sha256sum app-debug.apk > app-debug.apk.sha256
        working-directory: android/app/build/outputs/apk/debug
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Android-Debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      # CI-only signing material verifies release builds. These candidates are
      # re-signed with the existing protected distribution key before delivery.
      - name: Build release candidate with a disposable CI certificate
        env:
          MEMOFLOW_KEYSTORE_PATH: ${{ runner.temp }}/memoflow-ci.jks
          MEMOFLOW_KEYSTORE_PASSWORD: ci-verification-only
          MEMOFLOW_KEY_ALIAS: memoflow-ci
          MEMOFLOW_KEY_PASSWORD: ci-verification-only
        run: |
          keytool -genkeypair -keystore "$MEMOFLOW_KEYSTORE_PATH" -storepass "$MEMOFLOW_KEYSTORE_PASSWORD" -keypass "$MEMOFLOW_KEY_PASSWORD" -alias "$MEMOFLOW_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=MemoFlow CI candidate"
          cd android
          ./gradlew lintRelease testReleaseUnitTest assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Android-Release-Candidate
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows-release:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build:native
      - run: bun run desktop:prepare
      - name: Install pinned desktop build tools
        run: npm install --prefix "$env:RUNNER_TEMP/memoflow-electron" --no-save electron@44.9.0 @electron/packager@19.1.1
      - name: Package Windows executable with the bundled UI
        env:
          MEMOFLOW_DESKTOP_TOOLS: ${{ runner.temp }}/memoflow-electron
        run: node scripts/package-windows.mjs
      - name: Verify developer file metadata
        run: |
          $metadata = (Get-Item desktop-dist/MemoFlow-win32-x64/MemoFlow.exe).VersionInfo
          $expected = (Get-Content electron/package.json -Encoding utf8 | ConvertFrom-Json).author.name
          if ($metadata.CompanyName -ne $expected) { throw 'Developer name is missing from the Windows executable' }
      - name: Verify Windows signatures and record publisher status
        run: ./scripts/windows-signature.ps1
      - name: Exercise the packaged Windows executable
        env:
          MEMOFLOW_ELECTRON_PATH: ${{ github.workspace }}/desktop-dist/MemoFlow-win32-x64/MemoFlow.exe
          MEMOFLOW_DESKTOP_PACKAGED: "1"
        run: bun run test:desktop
      - name: Create Windows download
        run: Compress-Archive -Path desktop-dist/MemoFlow-win32-x64 -DestinationPath MemoFlow-Windows-1.2.11.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Windows-Release
          path: MemoFlow-Windows-1.2.11.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemoFlow-Windows-UI-Checks
          path: .qa-results/*.png
          include-hidden-files: true
          if-no-files-found: ignore
