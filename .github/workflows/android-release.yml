name: Build signed MemoFlow release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoflow-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run android:sync
      - name: Prepare protected release keystore
        env:
          MEMOFLOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.MEMOFLOW_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$MEMOFLOW_RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$MEMOFLOW_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/memoflow-release.jks"
      - name: Verify and build signed release
        env:
          MEMOFLOW_KEYSTORE_PATH: ${{ runner.temp }}/memoflow-release.jks
          MEMOFLOW_KEYSTORE_PASSWORD: ${{ secrets.MEMOFLOW_KEYSTORE_PASSWORD }}
          MEMOFLOW_KEY_ALIAS: ${{ secrets.MEMOFLOW_KEY_ALIAS }}
          MEMOFLOW_KEY_PASSWORD: ${{ secrets.MEMOFLOW_KEY_PASSWORD }}
        run: ./gradlew lintRelease testReleaseUnitTest assembleRelease bundleRelease --no-daemon
        working-directory: android
      - name: Verify signatures and write checksums
        run: |
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER_PATH"
          "$APKSIGNER_PATH" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Android-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/memoflow-release.jks"
