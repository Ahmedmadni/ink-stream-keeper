name: Build MemoFlow native installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoflow-native-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-test-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run project tests
        run: bun run test

      - name: Build, sync and verify the local Android web bundle
        run: bun run android:sync

      - name: Build and lint Android debug APK
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Verify APK and create checksum
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Android-Test-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Desktop (${{ matrix.target }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32
            arch: x64
            script: package-windows.mjs
            executable: MemoFlow.exe
          - os: macos-15
            target: darwin
            arch: arm64
            script: package-macos.mjs
            executable: MemoFlow.app/Contents/MacOS/MemoFlow
          - os: macos-15-intel
            target: darwin
            arch: x64
            script: package-macos.mjs
            executable: MemoFlow.app/Contents/MacOS/MemoFlow

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MEMOFLOW_DESKTOP_TOOLS: ${{ runner.temp }}/memoflow-desktop-tools
      MEMOFLOW_MAC_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run project tests
        run: bun run test

      - name: Build the native-compatible local UI
        run: bun run build:native

      - name: Prepare the desktop application files
        run: bun run desktop:prepare

      - name: Verify desktop inputs
        shell: bash
        run: |
          test -s electron/web/index.html
          test -s electron/main.cjs
          test -s electron/preload.cjs
          test -s electron/package.json
          test -s electron/app.png
          test -s public/IBM-Plex-OFL.txt

      - name: Install the pinned Electron Packager
        shell: bash
        run: npm install --prefix "$MEMOFLOW_DESKTOP_TOOLS" --no-save --no-package-lock @electron/packager@19.1.1

      - name: Package the requested platform and architecture
        run: node scripts/${{ matrix.script }}

      - name: Verify Windows signature status
        if: matrix.target == 'win32'
        shell: pwsh
        run: ./scripts/windows-signature.ps1

      - name: Verify packaged executable
        shell: bash
        run: |
          test -x "desktop-dist/MemoFlow-${{ matrix.target }}-${{ matrix.arch }}/${{ matrix.executable }}"

      - name: Exercise the actual packaged application
        env:
          MEMOFLOW_ELECTRON_PATH: ${{ github.workspace }}/desktop-dist/MemoFlow-${{ matrix.target }}-${{ matrix.arch }}/${{ matrix.executable }}
          MEMOFLOW_DESKTOP_PACKAGED: "1"
        run: bun run test:desktop

      - name: Archive Windows portable application
        if: matrix.target == 'win32'
        shell: pwsh
        run: |
          Compress-Archive -Path desktop-dist/MemoFlow-win32-x64 -DestinationPath MemoFlow-win32-x64.zip
          (Get-FileHash MemoFlow-win32-x64.zip -Algorithm SHA256).Hash | Set-Content MemoFlow-win32-x64.zip.sha256

      - name: Archive macOS application
        if: matrix.target == 'darwin'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "desktop-dist/MemoFlow-darwin-${{ matrix.arch }}/MemoFlow.app" "MemoFlow-darwin-${{ matrix.arch }}.zip"
          shasum -a 256 "MemoFlow-darwin-${{ matrix.arch }}.zip" > "MemoFlow-darwin-${{ matrix.arch }}.zip.sha256"

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            MemoFlow-${{ matrix.target }}-${{ matrix.arch }}.zip
            MemoFlow-${{ matrix.target }}-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload desktop UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-${{ matrix.target }}-${{ matrix.arch }}-UI-Checks
          path: .qa-results/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
