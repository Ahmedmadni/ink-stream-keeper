name: Package current MemoFlow native apps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoflow-native-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run android:sync
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      - name: Record integrity
        run: sha256sum app-debug.apk > app-debug.apk.sha256
        working-directory: android/app/build/outputs/apk/debug
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-Android-Test-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32
            arch: x64
            script: package-windows.mjs
            executable: MemoFlow.exe
          - os: macos-15
            target: darwin
            arch: arm64
            script: package-macos.mjs
            executable: MemoFlow.app/Contents/MacOS/MemoFlow
          - os: macos-15-intel
            target: darwin
            arch: x64
            script: package-macos.mjs
            executable: MemoFlow.app/Contents/MacOS/MemoFlow
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MEMOFLOW_DESKTOP_TOOLS: ${{ runner.temp }}/memoflow-electron
      MEMOFLOW_MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build:native
      - run: bun run desktop:prepare
      - name: Install pinned desktop packaging tools
        run: npm install --prefix "${{ runner.temp }}/memoflow-electron" --no-save electron@44.9.0 @electron/packager@19.1.1
      - run: node scripts/${{ matrix.script }}
      - name: Verify Windows signature status
        if: matrix.target == 'win32'
        run: ./scripts/windows-signature.ps1
      - name: Exercise the actual packaged application
        env:
          MEMOFLOW_ELECTRON_PATH: ${{ github.workspace }}/desktop-dist/MemoFlow-${{ matrix.target }}-${{ matrix.arch }}/${{ matrix.executable }}
          MEMOFLOW_DESKTOP_PACKAGED: "1"
        run: bun run test:desktop
      - name: Archive Windows portable application
        if: matrix.target == 'win32'
        shell: pwsh
        run: |
          Compress-Archive -Path desktop-dist/MemoFlow-win32-x64 -DestinationPath MemoFlow-win32-x64.zip
          (Get-FileHash MemoFlow-win32-x64.zip -Algorithm SHA256).Hash | Set-Content MemoFlow-win32-x64.zip.sha256
      - name: Archive macOS application
        if: matrix.target == 'darwin'
        run: |
          ditto -c -k --sequesterRsrc --keepParent desktop-dist/MemoFlow-darwin-${{ matrix.arch }}/MemoFlow.app MemoFlow-darwin-${{ matrix.arch }}.zip
          shasum -a 256 MemoFlow-darwin-${{ matrix.arch }}.zip > MemoFlow-darwin-${{ matrix.arch }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MemoFlow-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            MemoFlow-${{ matrix.target }}-${{ matrix.arch }}.zip
            MemoFlow-${{ matrix.target }}-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MemoFlow-${{ matrix.target }}-${{ matrix.arch }}-UI-Checks
          path: .qa-results/*.png
          include-hidden-files: true
          if-no-files-found: ignore